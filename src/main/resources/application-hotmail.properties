# Perfil para una cuenta personal de Outlook/Hotmail autorizada con OAuth2.
# Se mantiene deshabilitado hasta establecer CORREO_HABILITADO=true.
app.correo.oauth.habilitado=true
app.correo.oauth.archivo=${OUTLOOK_TOKEN_FILE:.local/outlook-oauth.properties}
spring.mail.username=${SMTP_USERNAME:}
app.correo.remitente=${SMTP_FROM:${spring.mail.username}}
spring.mail.password=
logging.level.org.springframework.web.client=WARN
logging.level.org.springframework.http.converter=WARN
