spring.application.name=rinconcito
server.port=8081

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/rinconcito_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# Evidencias privadas de pagos
app.upload.reservas-pagos-dir=${user.home}/rinconcito-uploads/reservas-pagos
app.upload.evidencias-pagos-dir=${app.upload.reservas-pagos-dir}

# Imagenes publicas de productos
app.upload.productos-dir=${user.home}/rinconcito-uploads/productos
app.upload.productos-max-bytes=3145728

# Imagenes publicas de galeria
app.upload.galeria-dir=${user.home}/rinconcito-uploads/galeria
app.upload.galeria-max-bytes=5242880

# Limites de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Guardamos los logs tambien en disco para poder revisar fallos despues de reiniciar.
logging.file.name=${APP_LOG_FILE:logs/rinconcito.log}
logging.level.com.rinconcito=${APP_LOG_LEVEL:INFO}
# Rotamos los archivos para que los logs no ocupen todo el disco.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.logback.rollingpolicy.clean-history-on-start=true

# Correo deshabilitado hasta configurar el remitente y aplicar su migracion.
app.correo.habilitado=${CORREO_HABILITADO:false}
app.correo.remitente=${SMTP_FROM:rinconcito@example.test}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
