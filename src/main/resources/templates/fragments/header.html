<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark" style="background-color:#8C2F1B;">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">El Rinconcito Ayacuchano</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/nosotros}">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/carta}">Carta</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/eventos}">Eventos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reservas}">Reservas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/pedidos}">Pedidos</a></li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/perfil}">Mi cuenta</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-sm ms-2" style="background-color:#D4A017;color:#3B2A22;">Salir</button>
                    </form>
                </li>

                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/registro}">Registrarme</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-sm ms-2" th:href="@{/login}" style="background-color:#D4A017;color:#3B2A22;">Ingresar</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
