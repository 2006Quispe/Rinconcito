<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<th:block th:fragment="header">

    <nav class="navbar navbar-expand-lg navbar-dark header-publico">

        <div class="container">

            <a class="navbar-brand marca-publica"
               th:href="@{/}"
               aria-label="Rinconcito Ayacuchano Campestre">
                <img class="logo-publico"
                     th:src="@{/img/logo-rinconcito-nombre.png}"
                     src="/img/logo-rinconcito.png"
                     alt="Rinconcito Ayacuchano Campestre">
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navMenu"
                    aria-controls="navMenu"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse"
                 id="navMenu">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/nosotros}">
                            Nosotros
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/carta}">
                            Carta
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/reservas}">
                            Reservas
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/eventos}">
                            Eventos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/galeria}">
                            Galería
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2"
                        sec:authorize="hasRole('CLIENTE')">

                        <a class="btn btn-cuenta"
                           th:href="@{/mi-cuenta}">

                            <i class="bi bi-person-circle"></i>
                            Mi cuenta
                        </a>
                    </li>

                    <li class="nav-item ms-lg-2"
                        sec:authorize="isAuthenticated()">

                        <form th:action="@{/logout}"
                              method="post"
                              class="m-0">

                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}">

                            <button type="submit"
                                    class="btn btn-salir">

                                <i class="bi bi-box-arrow-right"></i>
                                Salir
                            </button>

                        </form>
                    </li>

                    <li class="nav-item ms-lg-2"
                        sec:authorize="!isAuthenticated()">

                        <a class="btn btn-ingresar"
                           th:href="@{/login}">

                            <i class="bi bi-person"></i>
                            Iniciar sesión
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <a th:href="@{/carrito}"
       class="carrito-flotante"
       aria-label="Abrir carrito"
       title="Mi carrito">

        <i class="bi bi-cart3"></i>

        <span class="carrito-contador"
              th:if="${carritoCount != null
                  and carritoCount > 0}"
              th:text="${carritoCount}">
            0
        </span>

    </a>

</th:block>

</body>
</html>
