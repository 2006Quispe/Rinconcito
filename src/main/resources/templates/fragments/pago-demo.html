<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="formulario(destino, clave, valor, concepto, resumen, importe, metodo)"
      method="post" th:action="${destino}" class="reserva-distribucion pago-demo">
    <input type="hidden" th:name="${clave}" th:value="${valor}">
    <div class="reserva-panel">
        <fieldset class="pago-demo-selector">
            <legend>Método de pago</legend>
            <div class="d-flex flex-wrap gap-2 mb-4">
                <th:block th:each="opcion : ${ {'TARJETA', 'YAPE', 'PLIN'} }">
                    <input type="radio" class="btn-check" name="metodo" required
                           th:id="${'demo-' + opcion}" th:value="${opcion}"
                           th:checked="${metodo == null ? opcion == 'TARJETA' : metodo.name() == opcion}">
                    <label class="btn reserva-metodo" th:for="${'demo-' + opcion}"
                           th:text="${#strings.capitalize(#strings.toLowerCase(opcion))}"></label>
                </th:block>
            </div>
        </fieldset>
        <fieldset data-pago-panel="TARJETA" class="pago-demo-tarjeta">
            <legend>Tarjeta de prueba</legend>
            <div class="pago-demo-credencial" aria-hidden="true">
                <i class="bi bi-credit-card-2-front"></i>
                <span>Rinconcito</span><strong>•••• 4242</strong>
            </div>
            <p class="form-text">Usa los datos de prueba que aparecen debajo. Este formulario es solo para la demo.</p>
            <label class="form-label" for="demo-numero">Número de tarjeta</label>
            <input id="demo-numero" class="form-control" type="text" inputmode="numeric"
                   autocomplete="off" maxlength="19" pattern="4242 ?4242 ?4242 ?4242"
                   placeholder="4242 4242 4242 4242" title="Usa 4242 4242 4242 4242" required>
            <div class="row g-3 mt-1">
                <div class="col-6">
                    <label class="form-label" for="demo-vence">Vencimiento</label>
                    <input id="demo-vence" class="form-control" type="text" autocomplete="off"
                           maxlength="5" pattern="12/30" placeholder="12/30" title="Usa 12/30" required>
                </div>
                <div class="col-6">
                    <label class="form-label" for="demo-cvv">CVV</label>
                    <input id="demo-cvv" class="form-control" type="text" inputmode="numeric"
                           autocomplete="off" maxlength="3" pattern="123" placeholder="123" title="Usa 123" required>
                </div>
            </div>
        </fieldset>
        <section data-pago-panel="YAPE" class="pago-demo-billetera" hidden>
            <div class="pago-demo-qr pago-demo-qr-yape" aria-hidden="true"><strong>DEMO</strong></div>
            <p>Código de prueba Yape · Decorativo</p>
        </section>
        <section data-pago-panel="PLIN" class="pago-demo-billetera" hidden>
            <div class="pago-demo-qr pago-demo-qr-plin" aria-hidden="true"><strong>DEMO</strong></div>
            <p>Código de prueba Plin · Decorativo</p>
        </section>
    </div>
    <aside class="reserva-panel reserva-resumen">
        <h2 th:text="${concepto}"></h2>
        <p th:if="${pedidoPagoDemo == null or pedidoPagoDemo.tipoPedido.name() != 'DELIVERY'}" th:text="${resumen}"></p>
        <div th:if="${pedidoPagoDemo != null}">
            <ul class="list-unstyled mb-3">
                <li th:each="detalle : ${detallesPagoDemo}" class="d-flex justify-content-between gap-3 py-2 border-bottom">
                    <span th:text="|${detalle.cantidad} × ${detalle.producto.nombre}|"></span>
                    <strong class="text-nowrap" th:text="|S/ ${#numbers.formatDecimal(detalle.subtotal, 1, 'POINT', 2, 'POINT')}|"></strong>
                </li>
            </ul>
            <dl class="mb-0">
                <div class="d-flex justify-content-between gap-3">
                    <dt>Subtotal de productos</dt>
                    <dd th:text="|S/ ${#numbers.formatDecimal(pedidoPagoDemo.subtotal, 1, 'POINT', 2, 'POINT')}|"></dd>
                </div>
                <div th:if="${pedidoPagoDemo.tipoPedido.name() == 'DELIVERY'}" class="d-flex justify-content-between gap-3">
                    <dt>Delivery</dt>
                    <dd th:text="|S/ ${#numbers.formatDecimal(pedidoPagoDemo.costoDelivery, 1, 'POINT', 2, 'POINT')}|"></dd>
                </div>
            </dl>
        </div>
        <p class="reserva-total" th:text="|Total · S/ ${#numbers.formatDecimal(importe, 1, 'POINT', 2, 'POINT')}|"></p>
        <button type="submit" name="aprobado" value="true" class="carta-boton carta-boton-ancho"
                th:text="|Pagar S/ ${#numbers.formatDecimal(importe, 1, 'POINT', 2, 'POINT')}|">Pagar</button>
    </aside>
</form>
</body>
</html>
