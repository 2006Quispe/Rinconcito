<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">
        El Rinconcito Ayacuchano
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600&amp;display=swap"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <section class="text-center text-light py-5"
             style="background-color:#8C2F1B;">
        <div class="container py-3">
            <h1 class="fw-title">Crea tu cuenta</h1>
        </div>
    </section>

    <section class="container py-5"
             style="max-width:560px;">

        <div th:if="${exito}"
             class="alert alert-success">
            ¡Cuenta creada correctamente!
            Ya puedes
            <a th:href="@{/login}">
                iniciar sesión
            </a>.
        </div>

        <form th:if="${exito == null}"
              th:action="@{/registro}"
              th:object="${registroForm}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert alert-danger">

                <div th:each="error : ${#fields.globalErrors()}"
                     th:text="${error}">
                    No se pudo completar el registro.
                </div>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label for="nombres"
                           class="form-label">
                        Nombres
                    </label>

                    <input type="text"
                           id="nombres"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('nombres')} ? ' is-invalid' : ''"
                           th:field="*{nombres}"
                           minlength="3"
                           maxlength="25"
                           pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+(?:[ '\-][A-Za-zÁÉÍÓÚáéíóúÑñÜü]+)*"
                           autocomplete="given-name"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{nombres}">
                        Revisa los nombres.
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="apellidos"
                           class="form-label">
                        Apellidos
                    </label>

                    <input type="text"
                           id="apellidos"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('apellidos')} ? ' is-invalid' : ''"
                           th:field="*{apellidos}"
                           minlength="3"
                           maxlength="25"
                           pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+(?:[ '\-][A-Za-zÁÉÍÓÚáéíóúÑñÜü]+)*"
                           autocomplete="family-name"
                           required>

                    <div class="invalid-feedback"
                         th:errors="*{apellidos}">
                        Revisa los apellidos.
                    </div>
                </div>

            </div>

            <div class="mb-3">
                <label for="dni"
                       class="form-label">
                    DNI
                </label>

                <input type="text"
                       id="dni"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('dni')} ? ' is-invalid' : ''"
                       th:field="*{dni}"
                       inputmode="numeric"
                       minlength="8"
                       maxlength="8"
                       pattern="[0-9]{8}"
                       autocomplete="off"
                       required>

                <div class="invalid-feedback"
                     th:errors="*{dni}">
                    Revisa el DNI.
                </div>
            </div>

            <div class="mb-3">
                <label for="telefono"
                       class="form-label">
                    Teléfono
                </label>

                <input type="tel"
                       id="telefono"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('telefono')} ? ' is-invalid' : ''"
                       th:field="*{telefono}"
                       inputmode="numeric"
                       minlength="9"
                       maxlength="9"
                       pattern="9[0-9]{8}"
                       autocomplete="tel"
                       required>

                <div class="invalid-feedback"
                     th:errors="*{telefono}">
                    Revisa el teléfono.
                </div>
            </div>

            <div class="mb-3">
                <label for="correo"
                       class="form-label">
                    Correo electrónico
                </label>

                <input type="email"
                       id="correo"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('correo')} ? ' is-invalid' : ''"
                       th:field="*{correo}"
                       minlength="6"
                       maxlength="30"
                       autocomplete="email"
                       required>

                <div class="invalid-feedback"
                     th:errors="*{correo}">
                    Revisa el correo.
                </div>
            </div>

            <div class="mb-3">
                <label for="contrasena"
                       class="form-label">
                    Contraseña
                </label>

                <input type="password"
                       id="contrasena"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('contrasena')} ? ' is-invalid' : ''"
                       th:field="*{contrasena}"
                       minlength="8"
                       maxlength="20"
                       autocomplete="new-password"
                       required>

                <div class="form-text">
                    Utiliza entre 8 y 20 caracteres.
                </div>

                <div class="invalid-feedback"
                     th:errors="*{contrasena}">
                    Revisa la contraseña.
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmarContrasena"
                       class="form-label">
                    Confirmar contraseña
                </label>

                <input type="password"
                       id="confirmarContrasena"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('confirmarContrasena')} ? ' is-invalid' : ''"
                       th:field="*{confirmarContrasena}"
                       minlength="8"
                       maxlength="20"
                       autocomplete="new-password"
                       required>

                <div class="invalid-feedback"
                     th:errors="*{confirmarContrasena}">
                    Las contraseñas deben coincidir.
                </div>
            </div>

            <button type="submit"
                    class="btn btn-lg w-100"
                    style="background-color:#D4A017;color:#3B2A22;">
                Registrarme
            </button>

        </form>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
