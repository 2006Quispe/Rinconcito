<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">El Rinconcito Ayacuchano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <section class="text-center text-light py-5" style="background-color:#8C2F1B;">
        <div class="container py-3">
            <h1 class="fw-title">Haz tu pedido</h1>
            <p class="lead mb-0">Delivery o para recoger en el local</p>
        </div>
    </section>

    <section class="container py-5" style="max-width:800px;">

        <div th:if="${exito}" class="alert alert-success">
            <h5 class="alert-heading">¡Pedido registrado!</h5>
            <p class="mb-1">Tipo: <strong th:text="${pedido.tipoPedido}"></strong></p>
            <p class="mb-1">Total: <strong th:text="'S/ ' + ${pedido.total}"></strong></p>
            <p class="mb-0" th:if="${pago != null}">
                <i class="bi bi-credit-card"></i>
                Pago confirmado (operación <span th:text="${pago.numeroOperacion}"></span>)
            </p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:if="${exito == null}" th:action="@{/pedidos}" th:object="${pedidoForm}" method="post">

            <div class="mb-3">
                <label class="form-label">DNI</label>
                <input type="text" class="form-control" th:field="*{dni}" maxlength="8" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombres</label>
                    <input type="text" class="form-control" th:field="*{nombres}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Apellidos</label>
                    <input type="text" class="form-control" th:field="*{apellidos}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" class="form-control" th:field="*{telefono}" maxlength="9" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Tipo de pedido</label>
                <select class="form-select" th:field="*{tipoPedido}" id="tipoPedido" required>
                    <option value="">Selecciona...</option>
                    <option value="DELIVERY">Delivery (+ S/ 8)</option>
                    <option value="PRESENCIAL">Recojo en el local</option>
                </select>
            </div>

            <div class="mb-3" id="campoDireccion">
                <label class="form-label">Dirección de entrega</label>
                <input type="text" class="form-control" th:field="*{direccionTexto}">
            </div>

            <hr>
            <h5 class="fw-title mb-3">Elige tus platos</h5>

            <div class="row g-3 mb-3" th:each="producto, prodStat : ${productos}">
                <input type="hidden" th:field="*{items[__${prodStat.index}__].idProducto}">
                <div class="col-7">
                    <strong th:text="${producto.nombre}">Producto</strong><br>
                    <small class="text-muted" th:text="'S/ ' + ${producto.precio}"></small>
                </div>
                <div class="col-5">
                    <input type="number" min="0" class="form-control" th:field="*{items[__${prodStat.index}__].cantidad}">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Observaciones (opcional)</label>
                <textarea class="form-control" th:field="*{observaciones}" rows="2"></textarea>
            </div>

            <button type="submit" class="btn btn-lg w-100" style="background-color:#D4A017;color:#3B2A22;">Confirmar pedido</button>
        </form>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var tipo = document.getElementById('tipoPedido');
        var campoDireccion = document.getElementById('campoDireccion');
        function actualizar() {
            campoDireccion.style.display = (tipo.value === 'DELIVERY') ? 'block' : 'none';
        }
        tipo.addEventListener('change', actualizar);
        actualizar();
    });
</script>
</body>
</html>
