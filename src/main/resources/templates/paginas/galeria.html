<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">El Rinconcito Ayacuchano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <section class="text-center text-light py-5" style="background-color:#8C2F1B;">
        <div class="container py-3">
            <h1 class="fw-title">Galería</h1>
            <p class="lead mb-0">Momentos, platos y ambiente campestre ayacuchano</p>
        </div>
    </section>

    <section class="container py-5">
        <div th:if="${imagenes.isEmpty()}" class="text-center py-5">
            <p class="lead">Pronto publicaremos fotos de nuestro local y de la carta.</p>
        </div>

        <div class="row g-4">
            <div class="col-sm-6 col-lg-4" th:each="imagen : ${imagenes}">
                <div class="card h-100 shadow-sm">
                    <img th:src="${imagen.rutaImagen}" class="card-img-top" th:alt="${imagen.titulo}">
                    <div class="card-body" th:if="${imagen.titulo != null or imagen.descripcion != null}">
                        <h5 class="card-title fw-title" th:if="${imagen.titulo != null}" th:text="${imagen.titulo}">Título</h5>
                        <p class="card-text mb-0" th:if="${imagen.descripcion != null}" th:text="${imagen.descripcion}">Descripción</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
