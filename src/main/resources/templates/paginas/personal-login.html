<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">
        Acceso del personal
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600&amp;display=swap"
          rel="stylesheet">

    <link th:href="@{/css/estilos.css}"
          rel="stylesheet">
</head>

<body>

<main>

    <section class="text-center text-light py-5"
             style="background-color:#3B2A22;">

        <div class="container py-3">

            <i class="bi bi-shield-lock fs-1 mb-3 d-block"></i>

            <h1 class="fw-title">
                Acceso del personal
            </h1>

            <p class="mb-0 text-white-50">
                Solo para personal autorizado
            </p>

        </div>

    </section>

    <section class="container py-5"
             style="max-width:400px;">

        <div th:if="${error}"
             class="alert alert-danger">

            Correo o contraseña incorrectos.

        </div>

        <div th:if="${param.sinPermiso}"
             class="alert alert-warning">

            Tu usuario no tiene permiso para acceder
            a esa sección.

        </div>

        <form th:action="@{/personal/login}"
              method="post"
              class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <!-- Token obligatorio de Spring Security -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="mb-3">

                    <label for="correo"
                           class="form-label">
                        Correo
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input type="email"
                               id="correo"
                               name="correo"
                               class="form-control"
                               required
                               autocomplete="username"
                               placeholder="correo@rinconcito.pe">

                    </div>

                </div>

                <div class="mb-4">

                    <label for="contrasena"
                           class="form-label">
                        Contraseña
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input type="password"
                               id="contrasena"
                               name="contrasena"
                               class="form-control"
                               required
                               autocomplete="current-password"
                               placeholder="Ingresa tu contraseña">

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-lg w-100"
                        style="background-color:#D4A017;
                               color:#3B2A22;">

                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Ingresar

                </button>

            </div>

        </form>

        <p class="text-center mt-4">

            <a th:href="@{/}"
               class="text-muted small">

                <i class="bi bi-arrow-left me-1"></i>
                Volver al sitio

            </a>

        </p>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
