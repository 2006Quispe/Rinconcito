<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo}">
        Evento
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600;700&amp;display=swap"
          rel="stylesheet">

    <link th:href="@{/css/admin.css}"
          rel="stylesheet">
</head>

<body>

<div class="admin-layout">

    <aside th:replace="~{fragments/admin-sidebar :: sidebar('eventos')}">
    </aside>

    <main class="admin-contenido">

        <header class="admin-encabezado">

            <div>
                <span class="admin-etiqueta">
                    EVENTOS
                </span>

                <h1 th:text="${titulo}">
                    Nuevo evento
                </h1>

                <p>
                    Completa la programación y el precio
                    de entrada del evento.
                </p>
            </div>

            <a th:href="@{/admin/eventos}"
               class="admin-boton-secundario">

                <i class="bi bi-arrow-left"></i>
                Volver

            </a>

        </header>

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">
        </div>

        <form th:action="@{/admin/eventos/guardar}"
              th:object="${evento}"
              method="post"
              class="admin-formulario">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <input type="hidden"
                   th:field="*{idEvento}">

            <div class="admin-formulario-cabecera">

                <div class="admin-tarjeta-icono morado">
                    <i class="bi bi-music-note-beamed"></i>
                </div>

                <div>
                    <h2>Información del evento</h2>
                    <p>
                        Los datos se mostrarán en la página pública.
                    </p>
                </div>

            </div>

            <div class="row g-4">

                <div class="col-12">

                    <label class="form-label">
                        Título del evento
                    </label>

                    <input type="text"
                           th:field="*{titulo}"
                           class="form-control"
                           maxlength="100"
                           required
                           placeholder="Ejemplo: Noche de música ayacuchana">

                </div>

                <div class="col-12">

                    <label class="form-label">
                        Descripción
                    </label>

                    <textarea th:field="*{descripcion}"
                              class="form-control"
                              maxlength="500"
                              rows="4"
                              placeholder="Describe la presentación y los artistas invitados"></textarea>

                </div>

                <div class="col-md-4">

                    <label class="form-label">
                        Fecha
                    </label>

                    <input type="date"
                           th:field="*{fecha}"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-4">

                    <label class="form-label">
                        Hora de inicio
                    </label>

                    <input type="time"
                           th:field="*{horaInicio}"
                           class="form-control"
                           required>

                </div>

                <div class="col-md-4">

                    <label class="form-label">
                        Hora de finalización
                    </label>

                    <input type="time"
                           th:field="*{horaFin}"
                           class="form-control">

                </div>

                <div class="col-12">

                    <label class="form-label">
                        Ruta o enlace de la imagen
                    </label>

                    <input type="text"
                           th:field="*{imagen}"
                           class="form-control"
                           maxlength="255"
                           placeholder="/img/eventos/evento.jpg">

                    <div class="form-text">
                        Más adelante agregaremos la carga directa
                        de imágenes desde la computadora.
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="admin-opcion-pago">

                        <input type="checkbox"
                               th:field="*{requierePago}"
                               id="requierePago">

                        <label for="requierePago">
                            <strong>Evento con entrada pagada</strong>
                            <span>
                                Se cobrará por cada persona de la reserva.
                            </span>
                        </label>

                    </div>

                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        Precio por persona
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            S/
                        </span>

                        <input type="number"
                               th:field="*{precioEntrada}"
                               class="form-control"
                               min="0"
                               step="1">

                    </div>

                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        Estado
                    </label>

                    <select th:field="*{estado}"
                            class="form-select"
                            required>

                        <option th:each="estado : ${estados}"
                                th:value="${estado}"
                                th:text="${estado}">
                        </option>

                    </select>

                </div>

            </div>

            <div class="admin-formulario-acciones">

                <a th:href="@{/admin/eventos}"
                   class="admin-boton-secundario">
                    Cancelar
                </a>

                <button type="submit"
                        class="admin-boton-principal">

                    <i class="bi bi-check-lg"></i>
                    Guardar evento

                </button>

            </div>

        </form>

    </main>

</div>

</body>
</html>
