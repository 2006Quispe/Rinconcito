<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Rinconcito Ayacuchano Campestre'">
        Carrito - Rinconcito Ayacuchano Campestre
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap"
          rel="stylesheet">
    <link th:href="@{/css/estilos.css}"
          rel="stylesheet">
    <link th:href="@{/css/pedidos-ui.css}"
          rel="stylesheet">
</head>

<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container py-5">
    <section class="card p-3 p-md-4 mx-auto carrito-pagina" aria-labelledby="carrito-titulo">
        <h1 id="carrito-titulo" th:text="|Tu carrito (${unidades})|">Tu carrito</h1>
        <div th:replace="~{fragments/carrito-lateral :: contenido}"></div>
        <a class="mt-3" th:href="@{/carta}">Volver a la carta</a>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
