<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">El Rinconcito Ayacuchano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <section class="text-center text-light py-5" style="background-color:#8C2F1B;">
        <div class="container py-3">
            <h1 class="fw-title">Eventos</h1>
            <p class="lead mb-0">Almuerzo Show cada sábado, domingo y feriado</p>
        </div>
    </section>

    <section class="container py-5">

        <div th:if="${eventos.isEmpty()}" class="text-center py-5">
            <p class="lead">No hay eventos programados por el momento.</p>
        </div>

        <div class="row g-4">
            <div class="col-md-6" th:each="evento : ${eventos}">
                <div class="card h-100 shadow-sm">
                    <img th:if="${evento.imagen != null}" th:src="${evento.imagen}" class="card-img-top" alt="Evento">
                    <div class="card-body">
                        <h5 class="card-title fw-title" th:text="${evento.titulo}">Título del evento</h5>
                        <p class="text-muted mb-1">
                            <i class="bi bi-calendar-event"></i>
                            <span th:text="${#temporals.format(evento.fecha, 'dd/MM/yyyy')}">Fecha</span>
                            —
                            <span th:text="${#temporals.format(evento.horaInicio, 'HH:mm')}">Hora</span>
                        </p>
                        <p class="card-text" th:text="${evento.descripcion}">Descripción</p>
                    </div>
                </div>
            </div>
        </div>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
