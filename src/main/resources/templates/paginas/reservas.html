<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">El Rinconcito Ayacuchano</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <section class="text-center text-light py-5" style="background-color:#8C2F1B;">
        <div class="container py-3">
            <h1 class="fw-title">Reserva tu mesa</h1>
            <p class="lead mb-0">Asegura tu lugar para el Almuerzo Show</p>
        </div>
    </section>

    <section class="container py-5" style="max-width:700px;">

        <!-- Mensaje de éxito -->
        <div th:if="${exito}" class="alert alert-success">
            <h5 class="alert-heading">¡Reserva confirmada!</h5>

            <p class="mb-0">
                Mesa <strong th:text="${reserva.mesa.numero}"></strong>
                (piso <span th:text="${reserva.mesa.piso.nombre}"></span>)
                para <strong th:text="${reserva.numeroPersonas}"></strong> personas,
                el <strong th:text="${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy')}"></strong>
                a las <strong th:text="${#temporals.format(reserva.horaInicio, 'HH:mm')}"></strong>.
            </p>

            <!-- Información del pago -->
            <p th:if="${pago != null}" class="mb-0 mt-2">
                <i class="bi bi-credit-card"></i>
                Entrada cobrada:
                <strong th:text="'S/ ' + ${pago.monto}"></strong>
                (operación <span th:text="${pago.numeroOperacion}"></span>)
            </p>

        </div>

        <!-- Error -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Formulario -->
        <form th:if="${exito == null}"
              th:action="@{/reservas}"
              th:object="${reservaForm}"
              method="post">

            <div class="mb-3">
                <label class="form-label">DNI</label>
                <input type="text"
                       class="form-control"
                       th:field="*{dni}"
                       maxlength="8"
                       required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombres</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{nombres}"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Apellidos</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{apellidos}"
                           required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text"
                       class="form-control"
                       th:field="*{telefono}"
                       maxlength="9"
                       required>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Fecha</label>
                    <input type="date"
                           class="form-control"
                           th:field="*{fecha}"
                           th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Hora de inicio</label>
                    <input type="time"
                           class="form-control"
                           th:field="*{horaInicio}"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">N° de personas</label>
                    <input type="number"
                           min="1"
                           class="form-control"
                           th:field="*{numeroPersonas}"
                           required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Ocasión especial (opcional)</label>
                <input type="text"
                       class="form-control"
                       th:field="*{ocasionEspecial}">
            </div>

            <div class="mb-3">
                <label class="form-label">Comentarios (opcional)</label>
                <textarea class="form-control"
                          th:field="*{comentarios}"
                          rows="3"></textarea>
            </div>

            <button type="submit"
                    class="btn btn-lg w-100"
                    style="background-color:#D4A017;color:#3B2A22;">
                Confirmar reserva
            </button>

        </form>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
