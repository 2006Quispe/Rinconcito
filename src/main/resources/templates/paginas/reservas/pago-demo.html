<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pago de la reserva · Rinconcito Ayacuchano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600;800&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <link th:href="@{/css/reserva-publica.css}" rel="stylesheet">
</head>
<body class="carta-publica">
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <section class="carta-portada reserva-portada">
        <div class="container">
            <h1>Pago de la reserva</h1>
            <p>Modo de prueba · Sin cobro real</p>
        </div>
    </section>
    <div class="container reserva-contenido">
        <p th:if="${error}" class="alert alert-warning" role="alert" th:text="${error}"></p>
        <section th:if="${reserva != null}" class="reserva-panel" aria-labelledby="confirmacion">
            <h2 id="confirmacion">Reserva confirmada</h2>
            <p>Tu código de reserva es <strong th:text="${reserva.codigoReserva}"></strong>.</p>
            <p th:text="|${evento} · ${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy')} · ${#temporals.format(reserva.horaInicio, 'HH:mm')}|"></p>
            <p th:text="|Pago simulado con ${metodo} · S/ ${importe}|"></p>
            <div th:replace="~{fragments/aviso-correo :: aviso('reserva', false)}"></div>
            <a class="carta-boton" th:href="@{/reservas/consultar(codigo=${reserva.codigoReserva})}">Consultar reserva</a>
        </section>
        <form th:if="${intento != null and reserva == null}" method="post"
              th:action="@{/reservas/pago-demo}" class="reserva-distribucion">
            <input type="hidden" name="intento" th:value="${intento}">
            <fieldset class="reserva-panel">
                <legend class="h4 mb-3">Método de pago</legend>
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <th:block th:each="opcion : ${ {'TARJETA', 'YAPE', 'PLIN'} }">
                        <input type="radio" class="btn-check" name="metodo" required
                               th:id="${'demo-' + opcion}" th:value="${opcion}"
                               th:checked="${metodo != null and metodo.name() == opcion}">
                        <label class="btn reserva-metodo" th:for="${'demo-' + opcion}"
                               th:text="${#strings.capitalize(#strings.toLowerCase(opcion))}"></label>
                    </th:block>
                </div>
                <p class="mb-0">Elige un método para simular el pago. No necesitas ingresar datos de tarjeta ni escanear un código.</p>
            </fieldset>
            <aside class="reserva-panel reserva-resumen">
                <h2>Tu reserva</h2>
                <p th:text="${evento}"></p>
                <p th:text="|${personas} × S/ ${precioEntrada}|"></p>
                <p class="reserva-total" th:text="|Total · S/ ${importe}|"></p>
                <button type="submit" name="aprobado" value="true" class="carta-boton carta-boton-ancho">Simular pago aprobado</button>
                <button type="submit" name="aprobado" value="false" class="btn reserva-metodo w-100 mt-2">Simular rechazo</button>
            </aside>
        </form>
        <a th:if="${reserva == null}" class="btn reserva-metodo mt-3" th:href="@{/reservas}">Volver a reservas</a>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
