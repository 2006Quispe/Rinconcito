<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pago de la reserva · Rinconcito Ayacuchano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600;800&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <link th:href="@{/css/reserva-publica.css}" rel="stylesheet">
</head>
<body class="carta-publica">
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <section class="carta-portada reserva-portada">
        <div class="container">
            <h1>Pago de la reserva</h1>
            <p>Modo de prueba · Sin cobro real</p>
        </div>
    </section>
    <div class="container reserva-contenido">
        <p th:if="${error}" class="alert alert-warning" role="alert" th:text="${error}"></p>
        <section th:if="${reserva != null}" class="reserva-panel" aria-labelledby="confirmacion">
            <h2 id="confirmacion">Reserva confirmada</h2>
            <p>Tu código de reserva es <strong th:text="${reserva.codigoReserva}"></strong>.</p>
            <p th:text="|${evento} · ${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy')} · ${#temporals.format(reserva.horaInicio, 'HH:mm')}|"></p>
            <p th:text="|Pago simulado con ${metodo} · S/ ${importe}|"></p>
            <div th:replace="~{fragments/aviso-correo :: aviso('reserva', false)}"></div>
            <a class="carta-boton" th:href="@{/reservas/consultar(codigo=${reserva.codigoReserva})}">Consultar reserva</a>
        </section>
        <div th:if="${intento != null and reserva == null}">
            <div th:replace="~{fragments/pago-demo :: formulario(@{/reservas/pago-demo}, 'intento', ${intento}, ${evento}, |${personas} entradas × S/ ${precioEntrada}|, ${importe}, ${metodo})}"></div>
        </div>
        <a th:if="${reserva == null}" class="btn reserva-metodo mt-3" th:href="@{/reservas}">Volver a reservas</a>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/pago-demo.js}"></script>
</body>
</html>
