<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">Consultar reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <section class="text-center text-light py-4" style="background-color:#8C2F1B;">
        <div class="container">
            <h1 class="fw-title">Consultar reserva</h1>
            <p class="mb-0">Ingresa tu código para ver el estado del pago</p>
        </div>
    </section>

    <section class="container py-5" style="max-width:640px;">
        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/reservas/consultar}" method="get" class="card shadow-sm mb-4">
            <div class="card-body">
                <label class="form-label">Código de reserva</label>
                <div class="input-group">
                    <input type="text" name="codigo" class="form-control"
                           th:value="${codigoBusqueda}"
                           placeholder="RES-2026-000001" required>
                    <button type="submit" class="btn" style="background-color:#D4A017;color:#3B2A22;">Buscar</button>
                </div>
            </div>
        </form>

        <div th:if="${reserva != null}" class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Resultado</h5>
                <p class="mb-1">Código: <strong th:text="${reserva.codigoReserva}"></strong></p>
                <p class="mb-1" th:if="${reserva.evento != null}">
                    Evento: <strong th:text="${reserva.evento.titulo}"></strong>
                </p>
                <p class="mb-1">
                    Fecha:
                    <strong th:text="${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy')}"></strong>
                    ·
                    <strong th:text="${#temporals.format(reserva.horaInicio, 'HH:mm')}"></strong>
                </p>
                <p class="mb-1">Estado reserva: <strong th:text="${reserva.estado}"></strong></p>
                <p class="mb-1" th:if="${pago != null}">
                    Estado pago: <strong th:text="${pago.estado}"></strong>
                    · Medio: <span th:text="${pago.metodoPago}"></span>
                </p>
                <p class="mb-1" th:if="${reserva.mesa != null}">
                    Mesa: <strong th:text="${reserva.mesa.numero}"></strong>
                    (<span th:text="${reserva.pisoSolicitado.nombre}"></span>)
                </p>
                <div class="alert mt-3 mb-0"
                     th:classappend="${reserva.estado.name() == 'CONFIRMADA'} ? 'alert-success' : (${reserva.estado.name() == 'PENDIENTE_VALIDACION'} ? 'alert-warning' : 'alert-secondary')"
                     th:text="${mensajeEstado}">
                </div>

                <div class="mt-3" th:if="${reserva.estado.name() == 'PENDIENTE_PAGO'}">
                    <a class="btn"
                       style="background-color:#D4A017;color:#3B2A22;"
                       th:href="@{/reservas/pago(codigo=${reserva.codigoReserva})}">
                        Ir a pagar / reenviar evidencia
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
