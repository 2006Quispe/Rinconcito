<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - Rinconcito'">Validar canjes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/caja.css}" rel="stylesheet">
    <link th:href="@{/css/caja-club.css}" rel="stylesheet">
</head>
<body class="caja-body">
<div class="caja-layout">
    <aside th:replace="~{fragments/caja-sidebar :: sidebar('club')}"></aside>
    <main class="caja-contenido caja-club">
        <header class="caja-club-hero">
            <span>CLUB RINCONCITO</span>
            <h1>Validar recompensa</h1>
            <p>Confirma el código del cliente. Cada canje se puede validar una sola vez.</p>
        </header>
        <div th:if="${canjeValidado}" class="caja-club-resultado correcto" role="status">
            <i class="bi bi-check-circle-fill"></i><div><strong>Canje validado</strong><span th:text="${canjeValidado}">Recompensa</span><code th:text="${codigoValidado}">RIN-XXXX</code></div>
        </div>
        <div th:if="${errorValidacion}" class="caja-club-resultado error" role="alert"><i class="bi bi-exclamation-circle-fill"></i><span th:text="${errorValidacion}">No se pudo validar.</span></div>
        <section class="caja-club-form-panel">
            <form th:action="@{/caja/club/validar}" method="post" class="caja-club-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="codigoCanje">Código de canje</label>
                <input id="codigoCanje" name="codigo" class="form-control" maxlength="32" required autocomplete="off" autofocus placeholder="RIN-XXXXXXXXXX">
                <small>Los productos, recuerdos y experiencias se entregan en el restaurante. Los cupones online se aplican al pedido.</small>
                <button class="btn-validar-club" type="submit"><i class="bi bi-shield-check"></i> Validar y marcar como utilizado</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
