<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo + ' · Nuestra carta'}">Detalle del producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <link th:href="@{/css/carta.css}" rel="stylesheet">
</head>
<body class="carta-publica">
<header th:replace="~{fragments/header :: header}"></header>
<main class="container carta-detalle-contenido">
    <a class="carta-volver" data-volver-carta th:href="@{/carta(q=${q},categoria=${categoriaSeleccionada})}">
        <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver a la carta
    </a>
    <div th:if="${exito}" class="alert alert-success" role="status" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <article class="carta-detalle">
        <div class="carta-detalle-foto">
            <img th:if="${!#strings.isEmpty(producto.imagen)}" th:src="${producto.imagen}" th:alt="${producto.nombre}" fetchpriority="high">
            <div th:unless="${!#strings.isEmpty(producto.imagen)}" class="carta-sin-foto">
                <i class="bi bi-image" aria-hidden="true"></i><span>Foto próximamente</span>
            </div>
        </div>
        <div class="carta-detalle-info">
            <p class="carta-etiqueta" th:text="${producto.categoria.nombre}">Especialidad campestre</p>
            <h1 th:text="${producto.nombre}">Producto</h1>
            <p class="carta-detalle-precio" th:text="${'S/ ' + producto.precio}">S/ 0</p>
            <p class="carta-detalle-descripcion" th:if="${!#strings.isEmpty(producto.descripcion)}" th:text="${producto.descripcion}"></p>
            <form th:if="${producto.disponible}" class="carta-detalle-compra" data-agregar-carrito
                  th:action="@{/carrito/agregar}" th:attr="data-ajax-url=@{/carrito/agregar-ajax}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="idProducto" th:value="${producto.idProducto}">
                <input type="hidden" name="redirect" th:value="@{/carta/{id}(id=${producto.idProducto},q=${q},categoria=${categoriaSeleccionada})}">
                <div class="carta-cantidad" data-selector-cantidad>
                    <button type="button" data-cantidad-paso="-1" aria-label="Reducir cantidad" disabled>−</button>
                    <label for="cantidadProducto" class="visually-hidden">Cantidad</label>
                    <input id="cantidadProducto" name="cantidad" type="number" min="1" max="30" value="1" step="1" required inputmode="numeric">
                    <button type="button" data-cantidad-paso="1" aria-label="Aumentar cantidad">+</button>
                </div>
                <button type="submit" class="carta-boton"><i class="bi bi-bag-plus" aria-hidden="true"></i> Agregar al carrito</button>
            </form>
            <p th:unless="${producto.disponible}" class="carta-detalle-agotado"><i class="bi bi-clock" aria-hidden="true"></i> Agotado por hoy. Explora otras opciones de nuestra carta.</p>
            <section class="carta-ingredientes" th:if="${!#lists.isEmpty(producto.listaIngredientes)}" aria-labelledby="tituloIngredientes">
                <h2 id="tituloIngredientes">Ingredientes</h2>
                <ul><li th:each="ingrediente : ${producto.listaIngredientes}" th:text="${ingrediente}">Ingrediente</li></ul>
            </section>
        </div>
    </article>
    <section th:if="${!#lists.isEmpty(relacionados)}" class="carta-relacionados" aria-labelledby="tituloRelacionados">
        <p class="carta-etiqueta">SIGUE DESCUBRIENDO</p>
        <h2 id="tituloRelacionados">Acompaña tu mesa con:</h2>
        <div class="carta-relacionados-grid">
            <article th:each="otro : ${relacionados}" class="carta-relacionado">
                <a class="carta-relacionado-foto"
                   th:href="@{/carta/{id}(id=${otro.idProducto},q=${q},categoria=${categoriaSeleccionada})}"
                   th:attr="aria-label=${'Ver detalle de ' + otro.nombre}">
                    <img th:if="${!#strings.isEmpty(otro.imagen)}" th:src="${otro.imagen}" alt="" loading="lazy">
                    <span th:unless="${!#strings.isEmpty(otro.imagen)}" class="carta-sin-foto"><i class="bi bi-image" aria-hidden="true"></i></span>
                </a>
                <div class="carta-relacionado-info">
                    <h3><a th:href="@{/carta/{id}(id=${otro.idProducto},q=${q},categoria=${categoriaSeleccionada})}"
                           th:text="${otro.nombre}">Producto</a></h3>
                    <span class="carta-precio" th:text="${'S/ ' + otro.precio}"></span>
                    <div class="carta-relacionado-acciones">
                        <a class="carta-ver-detalle"
                           th:href="@{/carta/{id}(id=${otro.idProducto},q=${q},categoria=${categoriaSeleccionada})}">Ver detalle</a>
                        <form data-agregar-carrito th:action="@{/carrito/agregar}"
                              th:attr="data-ajax-url=@{/carrito/agregar-ajax}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="idProducto" th:value="${otro.idProducto}">
                            <input type="hidden" name="cantidad" value="1">
                            <input type="hidden" name="redirect" th:value="@{/carta/{id}(id=${producto.idProducto},q=${q},categoria=${categoriaSeleccionada})}">
                            <button type="submit" class="carta-boton carta-boton-agregar"
                                    th:attr="aria-label=${'Agregar ' + otro.nombre + ' al carrito'}">
                                <i class="bi bi-plus-lg" aria-hidden="true"></i> Agregar
                            </button>
                        </form>
                    </div>
                </div>
            </article>
        </div>
    </section>
</main>
<div class="carta-aviso" data-carta-aviso role="status" aria-live="polite" aria-atomic="true"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/carta.js}" defer></script>
</body>
</html>
