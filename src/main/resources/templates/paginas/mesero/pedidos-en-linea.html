<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}
        + ' - El Rinconcito Ayacuchano'">
        Pedidos en línea
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap"
          rel="stylesheet">
    <link th:href="@{/css/mesero-pedidos.css}"
          rel="stylesheet">
    <link th:href="@{/css/mesero-pedidos-online.css}"
          rel="stylesheet">
</head>

<body class="mesero-body">

<div class="mesero-layout">

    <aside th:replace="~{fragments/mesero-sidebar
        :: sidebar('pedidos-en-linea')}">
    </aside>

    <main class="mesero-pagina pedidos-web">
        <header class="pedidos-web-header">
            <div>
                <h1>Pedidos en línea</h1>
                <p>Prepara los pedidos de delivery y recojo en el local.</p>
            </div>
            <span class="pedidos-web-contador"
                  th:text="|${#lists.size(pedidosEnLinea)} por atender|"></span>
        </header>

        <p th:if="${error}" class="alert alert-warning" role="alert" th:text="${error}"></p>
        <section th:if="${#lists.isEmpty(pedidosEnLinea)}" class="pedidos-web-vacio">
            <i class="bi bi-bag-check" aria-hidden="true"></i>
            <h2>No hay pedidos por atender</h2>
        </section>
        <div class="pedidos-web-grid">
            <article class="pedido-web" th:each="orden : ${pedidosEnLinea}"
                     th:with="avance=${orden.avanceEntrega}, delivery=${orden.tipoPedido.name() == 'DELIVERY'}">
                <header class="pedido-web-header">
                    <span class="pedido-web-icono">
                        <i class="bi" th:classappend="${delivery ? 'bi-bicycle' : 'bi-bag-check'}" aria-hidden="true"></i>
                    </span>
                    <div>
                        <h2 th:text="${orden.codigoPedido}"></h2>
                        <p th:text="${delivery ? 'Delivery' : 'Recojo en el local'}"></p>
                    </div>
                    <span class="pedido-web-estado" th:attr="data-avance=${avance}"
                          th:text="${avance == 'RECIBIDO' ? 'Recibido' : (avance == 'EN_PREPARACION' ? 'En preparación' : (delivery ? 'En camino' : 'Listo para recoger'))}"></span>
                </header>
                <p class="pedido-web-direccion" th:if="${delivery and orden.direccion != null}">
                    <i class="bi bi-geo-alt" aria-hidden="true"></i>
                    <span th:text="|${orden.direccion.direccion}, ${orden.direccion.distrito}|"></span>
                </p>
                <ul class="pedido-web-productos">
                    <li th:each="linea : ${detallesPorPedido.get(orden.idPedido)}">
                        <strong th:text="|${linea.cantidad} ×|"></strong>
                        <span th:text="${linea.producto.nombre}"></span>
                    </li>
                </ul>
                <p class="pedido-web-nota" th:if="${!#strings.isEmpty(orden.observaciones)}"
                   th:text="${orden.observaciones}"></p>
                <footer class="pedido-web-footer">
                    <form method="post" th:action="@{/mesero/pedidos/{codigo}/avance(codigo=${orden.codigoPedido})}">
                        <input type="hidden" name="desde" th:value="${avance}">
                        <button class="pedido-web-accion" type="submit">
                            <span th:text="${avance == 'RECIBIDO' ? 'Iniciar preparación' : (avance == 'EN_PREPARACION' ? (delivery ? 'Marcar en camino' : 'Marcar listo para recoger') : 'Marcar entregado')}"></span>
                            <i class="bi bi-arrow-right" aria-hidden="true"></i>
                        </button>
                    </form>
                </footer>
            </article>
        </div>
    </main>
</div>
</body>
</html>
