<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pago del pedido · Rinconcito Ayacuchano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600;800&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
    <link th:href="@{/css/reserva-publica.css}" rel="stylesheet">
</head>
<body class="carta-publica">
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <div class="container reserva-contenido">
        <p th:if="${error}" class="alert alert-warning" role="alert" th:text="${error}"></p>
        <div th:if="${puedePagar}">
            <div th:replace="~{fragments/pago-demo :: formulario(@{/pedidos/pago-demo}, 'codigo', ${pedido.codigoPedido}, |Pedido ${pedido.codigoPedido}|, 'Recojo en el local', ${pedido.total}, null)}"></div>
        </div>
        <p th:unless="${puedePagar}">Esta sesión no tiene un pedido pendiente de pago.</p>
        <a th:if="${pedido != null and !puedePagar}" class="btn reserva-metodo" th:href="@{/pedidos/consultar(codigo=${pedido.codigoPedido})}">Consultar pedido</a>
        <a class="btn reserva-metodo mt-3" th:href="@{/carta}">Volver a la carta</a>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/pago-demo.js}"></script>
</body>
</html>
