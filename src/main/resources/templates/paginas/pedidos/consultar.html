<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">Consultar pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <section class="text-center text-light py-4" style="background-color:#8C2F1B;">
        <div class="container">
            <h1 class="fw-title">Consultar pedido</h1>
            <p class="mb-0">Ingresa tu codigo para ver el estado del pago</p>
        </div>
    </section>
    <section class="container py-5" style="max-width:640px;">
        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/pedidos/consultar}" method="get" class="card shadow-sm mb-4">
            <div class="card-body">
                <label class="form-label">Codigo de pedido</label>
                <div class="input-group">
                    <input type="text" name="codigo" class="form-control"
                           th:value="${codigoBusqueda}" placeholder="PED-2026-000001" required>
                    <button type="submit" class="btn" style="background-color:#D4A017;color:#3B2A22;">Buscar</button>
                </div>
            </div>
        </form>

        <div th:if="${pedido != null}" class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Resultado</h5>
                <p class="mb-1">Codigo: <strong th:text="${pedido.codigoPedido}"></strong></p>
                <p class="mb-1">Estado pedido: <strong th:text="${pedido.estado}"></strong></p>
                <p class="mb-1">Total: <strong th:text="'S/ ' + ${pedido.total}"></strong></p>
                <p class="mb-1" th:if="${pago != null}">
                    Estado pago: <strong th:text="${pago.estado}"></strong>
                    - Medio: <span th:text="${pago.metodoPago}"></span>
                </p>
                <ul class="small" th:if="${detalles != null}">
                    <li th:each="d : ${detalles}"
                        th:text="${d.producto.nombre + ' x ' + d.cantidad + ' = S/ ' + d.subtotal}"></li>
                </ul>
                <div class="alert mt-3 mb-0"
                     th:classappend="${pedido.estado.name() == 'CONFIRMADO'} ? 'alert-success' : (${pedido.estado.name() == 'PENDIENTE_VALIDACION'} ? 'alert-warning' : 'alert-secondary')"
                     th:text="${mensajeEstado}"></div>
                <p class="small text-muted mt-2 mb-0" th:if="${mensajeTraslado}" th:text="${mensajeTraslado}"></p>

                <div class="mt-3" th:if="${pedido.estado.name() == 'PENDIENTE_PAGO'}">
                    <a class="btn" style="background-color:#D4A017;color:#3B2A22;"
                       th:href="@{/pedidos/pago(codigo=${pedido.codigoPedido})}">
                        Ir a pagar / reenviar evidencia
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
