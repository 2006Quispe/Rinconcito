<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">El Rinconcito Ayacuchano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>
    <!-- BANNER DE LA CARTA -->
    <section class="carta-banner">
        <div class="container">
            <h1 class="carta-banner-title">Nuestra Carta</h1>
            <p class="carta-banner-desc">Sabor artesanal cocinado con pasión bajo el cielo ayacuchano.</p>
        </div>
    </section>
    
    <section class="container py-4">
        
        <div class="carta-filtro-contenedor mb-4">
            <form class="row g-3 align-items-end" method="get" th:action="@{/carta}">
                
                <div class="col-md-5">
                    <label class="filtro-label" for="q">Buscar por nombre</label>
                    <input type="search" class="form-control filtro-input" id="q" name="q" th:value="${q}"
                           placeholder="Ej. pachamanca, cuy, chicha…">
                </div>
                
                <div class="col-md-4">
                    <label class="filtro-label" for="categoria">Categoría</label>
                    <select class="form-select filtro-input" id="categoria" name="categoria">
                        <option value="">Todas las categorías</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.idCategoria}"
                                th:text="${cat.nombre}"
                                th:selected="${categoriaSeleccionada != null and categoriaSeleccionada == cat.idCategoria}">
                        </option>
                    </select>
                </div>
                
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-filtrar flex-fill">
                        <i class="bi bi-search"></i> Filtrar
                    </button>
                    <a th:href="@{/carta}" class="btn btn-ver-todos flex-fill">Ver todos</a>
                </div>
                
            </form>
        </div>

        <!-- A partir de aquí sigue tu código normal de los productos... -->

        <div th:if="${menu.isEmpty()}" class="text-center py-5">
            <p class="lead">No se encontraron platos con esos criterios.</p>
            <a th:href="@{/carta}" class="btn" style="background-color:#D4A017;color:#3B2A22;">Ver toda la carta</a>
        </div>

        <div th:each="entrada : ${menu}" class="mb-5">
            <h2 class="fw-title mb-3" style="color:#8C2F1B;" th:text="${entrada.key.nombre}">Categoría</h2>
            <p th:if="${entrada.key.descripcion != null}" class="text-muted" th:text="${entrada.key.descripcion}"></p>

            <div th:if="${entrada.value.isEmpty()}" class="text-muted mb-4">
                <em>Sin productos en esta categoría por ahora.</em>
            </div>

            <div class="row g-4">
                                <!-- NUEVO DISEÑO DE TARJETA -->
                <div class="col-lg-4 col-md-6 mb-4" th:each="producto : ${entrada.value}">
                    <article class="menu-card">
                        
                        <!-- Imagen -->
                        <div class="menu-card-img-container">
                            <!-- Si tiene imagen, la muestra -->
                            <img th:if="${producto.imagen != null and !#strings.isEmpty(producto.imagen)}"
                                 th:src="${producto.imagen}"
                                 th:alt="${producto.nombre}"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            
                            <!-- Imagen de reemplazo si no hay foto o falla -->
                            <div class="d-flex align-items-center justify-content-center h-100 text-muted w-100"
                                 th:style="${producto.imagen != null and !#strings.isEmpty(producto.imagen)} ? 'display:none;' : 'display:flex;'">
                                <i class="bi bi-image" style="font-size: 2.5rem; color: #d1d1d1;"></i>
                            </div>
                        </div>

                        <!-- Contenido -->
                        <div class="menu-card-body">
                            <div class="menu-card-title-row">
                                <h5 class="menu-card-title" th:text="${producto.nombre}">Nombre del Plato</h5>
                                <span class="menu-card-price" th:text="'S/ ' + ${producto.precio}">S/ 0</span>
                            </div>
                            
                            <p class="menu-card-desc" th:text="${producto.descripcion != null ? producto.descripcion : 'Sin descripción disponible.'}">
                                Descripción del plato.
                            </p>
                        </div>

                        <!-- Footer de la Tarjeta -->
                        <div class="menu-card-footer">
                            <span class="menu-card-category" th:text="${producto.categoria.nombre}">Categoría</span>
                            
                            <!-- Botón de Agregar -->
                            <form th:if="${producto.disponible}" th:action="@{/carrito/agregar-ajax}" method="post" class="m-0 form-agregar-carrito">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="idProducto" th:value="${producto.idProducto}"/>
                                <input type="hidden" name="cantidad" value="1"/>
                                <button type="submit" class="btn-agregar-menu">
                                    <i class="bi bi-plus-lg"></i> Agregar
                                </button>
                            </form>

                            <!-- Botón si está agotado -->
                            <button th:unless="${producto.disponible}" type="button" class="btn-agregar-menu btn-agotado" disabled>
                                Agotado
                            </button>
                        </div>
                    </article>
                </div>
            </div>
        </div>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        function mostrarAviso(mensaje, correcto) {
            let aviso = document.getElementById("avisoCartaAjax");

            if (!aviso) {
                aviso = document.createElement("div");
                aviso.id = "avisoCartaAjax";
                aviso.style.position = "fixed";
                aviso.style.right = "24px";
                aviso.style.top = "82px";
                aviso.style.zIndex = "2000";
                aviso.style.maxWidth = "340px";
                aviso.style.padding = "0.8rem 1rem";
                aviso.style.borderRadius = "10px";
                aviso.style.color = "#ffffff";
                aviso.style.fontWeight = "700";
                aviso.style.boxShadow =
                    "0 10px 28px rgba(46, 33, 28, 0.22)";

                document.body.appendChild(aviso);
            }

            aviso.textContent = mensaje;
            aviso.style.backgroundColor =
                correcto ? "#5c6e49" : "#a93226";
            aviso.style.display = "block";

            window.clearTimeout(aviso._temporizador);
            aviso._temporizador = window.setTimeout(
                function () {
                    aviso.style.display = "none";
                },
                2600
            );
        }

        document.querySelectorAll(".form-agregar-carrito")
            .forEach(function (formulario) {

                formulario.addEventListener(
                    "submit",
                    async function (evento) {
                        evento.preventDefault();

                        const boton =
                            formulario.querySelector(
                                "button[type='submit']"
                            );

                        const contenidoOriginal =
                            boton.innerHTML;

                        boton.disabled = true;
                        boton.innerHTML =
                            '<i class="bi bi-hourglass-split"></i> Agregando';

                        try {
                            const respuesta = await fetch(
                                formulario.action,
                                {
                                    method: "POST",
                                    body: new FormData(formulario),
                                    credentials: "same-origin",
                                    headers: {
                                        "X-Requested-With":
                                            "XMLHttpRequest"
                                    }
                                }
                            );

                            const datos =
                                await respuesta.json();

                            if (
                                !respuesta.ok
                                    || !datos.exito
                            ) {
                                throw new Error(
                                    datos.mensaje
                                        || "No se pudo agregar el producto."
                                );
                            }

                            let contador =
                                document.querySelector(
                                    ".carrito-contador"
                                );

                            if (!contador) {
                                const carrito =
                                    document.querySelector(
                                        ".carrito-flotante"
                                    );

                                if (carrito) {
                                    contador =
                                        document.createElement(
                                            "span"
                                        );

                                    contador.className =
                                        "carrito-contador";

                                    carrito.appendChild(
                                        contador
                                    );
                                }
                            }

                            if (contador) {
                                contador.textContent =
                                    datos.cantidadCarrito;
                                contador.style.display =
                                    "flex";
                            }

                            boton.innerHTML =
                                '<i class="bi bi-check-lg"></i> Agregado';

                            mostrarAviso(
                                datos.mensaje,
                                true
                            );

                        } catch (error) {
                            boton.innerHTML =
                                contenidoOriginal;

                            mostrarAviso(
                                error.message,
                                false
                            );
                        } finally {
                            window.setTimeout(
                                function () {
                                    boton.disabled = false;
                                    boton.innerHTML =
                                        contenidoOriginal;
                                },
                                1100
                            );
                        }
                    }
                );
            });
    });
</script>

</body>
</html>
