<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">El Rinconcito Ayacuchano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>
    <section class="container py-4">
        <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/carta}">
            <div class="col-md-5">
                <label class="form-label" for="q">Buscar por nombre</label>
                <input type="search" class="form-control" id="q" name="q" th:value="${q}"
                       placeholder="Ej. pachamanca, cuy, chicha…">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="categoria">Categoría</label>
                <select class="form-select" id="categoria" name="categoria">
                    <option value="">Todas las categorías</option>
                    <option th:each="cat : ${categorias}"
                            th:value="${cat.idCategoria}"
                            th:text="${cat.nombre}"
                            th:selected="${categoriaSeleccionada != null and categoriaSeleccionada == cat.idCategoria}">
                    </option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn flex-fill" style="background-color:#5C6E49;color:white;">
                    <i class="bi bi-search"></i> Filtrar
                </button>
                <a th:href="@{/carta}" class="btn btn-outline-secondary flex-fill">Ver todos</a>
            </div>
        </form>

        <div th:if="${menu.isEmpty()}" class="text-center py-5">
            <p class="lead">No se encontraron platos con esos criterios.</p>
            <a th:href="@{/carta}" class="btn" style="background-color:#D4A017;color:#3B2A22;">Ver toda la carta</a>
        </div>

        <div th:each="entrada : ${menu}" class="mb-5">
            <h2 class="fw-title mb-3" style="color:#8C2F1B;" th:text="${entrada.key.nombre}">Categoría</h2>
            <p th:if="${entrada.key.descripcion != null}" class="text-muted" th:text="${entrada.key.descripcion}"></p>

            <div th:if="${entrada.value.isEmpty()}" class="text-muted mb-4">
                <em>Sin productos en esta categoría por ahora.</em>
            </div>

            <div class="row g-4">
                <div class="col-md-4" th:each="producto : ${entrada.value}">
                    <div class="card h-100 shadow-sm producto-card"
                         th:classappend="${!producto.disponible} ? ' producto-agotado'">
                        <div class="ratio ratio-16x9 bg-light">
                            <img th:if="${producto.imagen != null and !#strings.isEmpty(producto.imagen)}"
                                 th:src="${producto.imagen}"
                                 th:alt="${producto.nombre}"
                                 class="card-img-top object-fit-cover"
                                 style="object-fit:cover;"
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="d-flex align-items-center justify-content-center text-muted"
                                 th:style="${producto.imagen != null and !#strings.isEmpty(producto.imagen)} ? 'display:none;' : ''">
                                <i class="bi bi-image" style="font-size:2.5rem;color:#B85C38;"></i>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start gap-2 mb-1">
                                <h5 class="card-title fw-title mb-0" th:text="${producto.nombre}">Producto</h5>
                                <span th:if="${!producto.disponible}" class="badge bg-danger">AGOTADO</span>
                            </div>
                            <p class="small text-muted mb-2">
                                <i class="bi bi-tag"></i>
                                <span th:text="${producto.categoria.nombre}">Categoría</span>
                            </p>
                            <p class="card-text" th:text="${producto.descripcion}">Descripción</p>
                            <p class="fw-bold mb-2" style="color:#B85C38;"
                               th:text="'S/ ' + ${producto.precio}">S/ 0</p>
                            <p class="small mb-0"
                               th:classappend="${producto.disponible} ? ' text-success' : ' text-danger'"
                               th:text="${producto.disponible} ? 'Disponible' : 'No disponible (agotado)'">
                                Disponible
                            </p>
                            <form th:if="${producto.disponible}" th:action="@{/carrito/agregar}" method="post" class="mt-3">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="idProducto" th:value="${producto.idProducto}"/>
                                <input type="hidden" name="cantidad" value="1"/>
                                <input type="hidden" name="redirect" value="/carta"/>
                                <button type="submit" class="btn btn-sm w-100" style="background-color:#D4A017;color:#3B2A22;">
                                    <i class="bi bi-cart-plus"></i> Agregar al carrito
                                </button>
                            </form>
                            <button th:unless="${producto.disponible}" type="button" class="btn btn-sm mt-3 w-100" disabled>
                                AGOTADO
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
