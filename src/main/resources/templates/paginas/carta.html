<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - El Rinconcito Ayacuchano'">El Rinconcito Ayacuchano</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&amp;family=Nunito:wght@400;600&amp;display=swap" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main>

    <section class="text-center text-light py-5" style="background-color:#8C2F1B;">
        <div class="container py-3">
            <h1 class="fw-title">Nuestra Carta</h1>
            <p class="lead mb-0">Sabores ayacuchanos preparados con tradición</p>
        </div>
    </section>

    <section class="container py-5">

        <div th:if="${menu.isEmpty()}" class="text-center py-5">
            <p class="lead">Todavía no hay platos cargados en la carta.</p>
        </div>

        <div th:each="entrada : ${menu}" class="mb-5">
            <h2 class="fw-title mb-3" style="color:#8C2F1B;" th:text="${entrada.key.nombre}">Categoría</h2>
            <p th:if="${entrada.key.descripcion != null}" class="text-muted" th:text="${entrada.key.descripcion}"></p>

            <div th:if="${entrada.value.isEmpty()}" class="text-muted mb-4">
                <em>Sin productos en esta categoría por ahora.</em>
            </div>

            <div class="row g-4">
                <div class="col-md-4" th:each="producto : ${entrada.value}">
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title fw-title" th:text="${producto.nombre}">Producto</h5>
                            <p class="card-text" th:text="${producto.descripcion}">Descripción</p>
                            <p class="fw-bold" style="color:#B85C38;" th:text="'S/ ' + ${producto.precio}">S/ 0</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
