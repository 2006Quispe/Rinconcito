# All automated tests use an isolated H2 database and never connect to the developer's MySQL.
spring.datasource.url=jdbc:h2:mem:rinconcito_tests;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
app.correo.habilitado=false
app.correo.remitente=pruebas@rinconcito.example
spring.mail.username=
spring.mail.password=
spring.mail.host=localhost
spring.mail.port=1025
app.upload.productos-dir=${user.dir}/target/test-uploads/productos
app.upload.galeria-dir=${user.dir}/target/test-uploads/galeria
app.upload.galeria-max-bytes=5242880
app.upload.reservas-pagos-dir=${user.dir}/target/test-uploads/pagos
app.upload.evidencias-pagos-dir=${user.dir}/target/test-uploads/pagos
